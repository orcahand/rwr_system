muscle_groups:
  thumb: # These are randomly allocated do not change
    joint_ids: [7, 9 ,6, 8] # [MCP, ABD, PIP, DIP]  
    motor_ids: [7, 9, 6, 8]           
    joint_roms: [[-45, 45], [-40, 50], [-10, 90], [0, 90]]
    tendon_ids: [1, 2, 3, 4, 5, 6, 7, 8]    
    motor_map: [7, 7, 9, 9, 6, 6, 8, 8]     
    spool_rad: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5] 

  index: 
    joint_ids: [1, 10, 5]           # [ABD, MCP, PIP]  ids for each controllable joint from proximal to distal 
    motor_ids: [1, 10 ,5]           # ids of motors for this muscle group
    motor_map: [1, 1, 10, 10, 5, 5]     # maps each tendon to a certain motor. antagonistic tendons have same motor id in motor_map
    joint_roms: [[-30, 30], [-20, 115], [0, 120]] # [PIP, MCP, ABD] 
    tendon_ids: [9, 10, 11, 12, 13, 14]    # ids for each tendon according to joints, first flexor then extensor, from proximal to distal
    spool_rad: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5] # [+ = counterclockwise motion, - clockwise motion]  
               # + = if tendon attaches on the left side it will shorten with a positive angle
  
